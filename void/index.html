<html lang="en">
<head>

  <title>—</title>

<body class="void-page">
  <main class="void-space">
    <div class="void-gate">
      <button class="void-proceed" type="button" aria-controls="void-code-form" aria-expanded="false">proceed?</button>
      <form id="void-code-form" class="void-code-form" hidden>
        <input id="void-code" class="void-code" type="text" name="code" aria-label="code" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="void-submit" type="submit" aria-label="Enter code">↗</button>
      </form>
      <a class="void-log-link" href="../log/index.html" hidden>log</a>
    </div>
  </main>
